name: Enterprise CRM Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Target Browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      env:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - stage
          - prod

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Run TestNG Automation Suite
        run: |
          cd 00_chapter_Prompt_Eng/Selenium_Framework
          mvn clean test -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} -Denv=${{ github.event.inputs.env || 'qa' }} -Dheadless=true

      - name: Archive ExtentReports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-test-execution-reports
          path: 00_chapter_Prompt_Eng/Selenium_Framework/reports/
          retention-days: 14
